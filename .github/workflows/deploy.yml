# Deploys the production stage (server worker, web, D1 with migrations, queues) with Alchemy.
#
# Only master deploys (also restrict the "production" environment to master in the repo settings).
# Off until the repo variable DEPLOY_ENABLED is "true", so forks and a fresh repo don't fail on missing secrets.
# Needs, in the "production" environment:
#   secrets: CLOUDFLARE_API_TOKEN, BETTER_AUTH_SECRET (32+ chars), TURNSTILE_SECRET_KEY (widget "wacheap-waitlist")
#            The token needs Account: Workers Scripts Edit, D1 Edit, Queues Edit, Secrets Store Edit (Alchemy keeps its
#            state-store token there), and Workers Routes/Zone edit once a custom domain is added.
#   vars:    CLOUDFLARE_ACCOUNT_ID, CORS_ORIGIN (the web origin; it must be a URL, so before the first deploy use the
#            planned domain or a placeholder, then set the real origin and rerun)
# WACheap Cloud billing (DOKU Checkout). Off until the environment variable WACHEAP_CLOUD is "true": set it at launch,
# so no trial starts before broadcasts exist. All three DOKU values are optional: without the two keys the deploy
# still succeeds and checkout answers "pembayaran belum disiapkan".
#   secrets: DOKU_CLIENT_ID (DOKU dashboard Client ID, "BRN-..."), DOKU_SECRET_KEY (DOKU Secret Key; also verifies the
#            payment webhook at https://wacheap-api.dzulfikar-at.workers.dev/api/billing/webhook)
#   vars:    DOKU_BASE_URL (empty = https://api.doku.com; https://api-sandbox.doku.com with sandbox keys)
# WhatsApp webhook (optional; without both the webhook at /api/whatsapp/webhook answers 503):
#   secrets: META_APP_SECRET (Meta app > Settings > Basic > App secret), WHATSAPP_VERIFY_TOKEN (any random string, also
#            typed into Meta app > WhatsApp > Configuration > Verify token)
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: "true"
      NODE_ENV: production
      ALCHEMY_STAGE: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bunx oxlint
      - run: bun test packages/api/src apps/web/src apps/server/src
      # Secrets only on this step, not during install scripts or checks.
      - name: Alchemy deploy
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          WACHEAP_CLOUD: ${{ vars.WACHEAP_CLOUD }}
          DOKU_CLIENT_ID: ${{ secrets.DOKU_CLIENT_ID }}
          DOKU_SECRET_KEY: ${{ secrets.DOKU_SECRET_KEY }}
          DOKU_BASE_URL: ${{ vars.DOKU_BASE_URL }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: env -u npm_execpath node ./node_modules/alchemy/bin/cli.js deploy --stage production --yes --no-input
