# Deploys the production stage (server worker, web, D1 with migrations, queues) with Alchemy.
#
# Off until the repo variable DEPLOY_ENABLED is "true", so forks and a fresh repo don't fail on missing secrets.
# Needs, in the "production" environment:
#   secrets: CLOUDFLARE_API_TOKEN (Workers, D1, Queues edit), ALCHEMY_PASSWORD, BETTER_AUTH_SECRET (32+ chars)
#   vars:    CLOUDFLARE_ACCOUNT_ID, CORS_ORIGIN (the web origin; it must be a URL, so before the first deploy use the
#            planned domain or a placeholder, then set the real origin and rerun)
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: "true"
      NODE_ENV: production
      ALCHEMY_STAGE: production
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - name: Alchemy deploy
        working-directory: packages/infra
        run: env -u npm_execpath node ./node_modules/alchemy/bin/cli.js deploy --stage production --yes --no-input
